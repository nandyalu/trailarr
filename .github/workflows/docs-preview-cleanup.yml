name: Docs Preview Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # Matches the guard in docs-preview.yml: a fork PR never gets a
    # preview folder, so there is nothing to clean up — and the push to
    # gh-pages would answer 403 anyway.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages

      - name: Remove docs preview for PR
        run: |
          PREVIEW_DIR="pr-${{ github.event.pull_request.number }}"
          if [ -d "$PREVIEW_DIR" ]; then
            rm -rf "$PREVIEW_DIR"
            echo "Deleted $PREVIEW_DIR"
          else
            echo "No preview directory found for PR #${{ github.event.pull_request.number }}"
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove docs preview for PR #${{ github.event.pull_request.number }}" || echo "Nothing to commit"
          git push origin gh-pages
