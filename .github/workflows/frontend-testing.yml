---
name: frontend test

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  run_frontend_tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Production build
        run: npm run build
