---
name: python test

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  run_python_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: cd backend && uv pip install --no-cache --native-tls --system -r pyproject.toml --group testing
      
      - name: Run tests
        run: cd backend && uv run python -m pytest tests

      - name: Get Coverage Report
        # Posting the coverage comment needs a writable GITHUB_TOKEN. Fork PRs
        # and Dependabot runs only get a read-only token, and workflow_dispatch
        # has no PR to comment on — skip in those cases.
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        uses: orgoro/coverage@v3.3
        with:
            coverageFile: backend/coverage.xml
            token: ${{ secrets.GITHUB_TOKEN }}
            sourceDir: backend