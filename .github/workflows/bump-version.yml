name: Bump Version

on:
  pull_request:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g. v0.9.5)'
        required: true

jobs:
  bump:
    name: Bump version files and regenerate OpenAPI spec
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # For pull_request: only run if PR title starts with a semver tag, e.g. "v0.9.5 - Some title"
    # and the branch is in this repository — the job pushes, and a fork PR
    # has a read-only GITHUB_TOKEN.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       startsWith(github.event.pull_request.title, 'v') &&
       github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
          else
            TITLE="${{ github.event.pull_request.title }}"
            TAG=$(echo "$TITLE" | grep -oP '^v\d+\.\d+\.\d+')
          fi
          if [ -z "$TAG" ]; then
            echo "No valid semver tag found, skipping."
            exit 0
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.head_ref }}

      - name: Bump version in pyproject.toml
        run: sed -i "s/^version = .*/version = \"${{ steps.version.outputs.version }}\"/" backend/pyproject.toml

      - name: Bump version in package.json
        run: |
          CURRENT=$(node -p "require('./frontend/package.json').version")
          TARGET="${{ steps.version.outputs.version }}"
          if [ "$CURRENT" = "$TARGET" ]; then
            echo "frontend/package.json already at $TARGET, skipping"
          else
            npm version "$TARGET" --no-git-tag-version --prefix frontend
          fi

      - name: Bump APP_VERSION in tasks.json
        run: |
          sed -i "s/\"APP_VERSION\": \"[^\"]*\"/\"APP_VERSION\": \"${{ steps.version.outputs.version }}\"/g" .vscode/tasks.json

      - name: Set up Python with uv
        uses: astral-sh/setup-uv@v7
        with:
          working-directory: backend

      - name: Install backend dependencies
        run: uv sync
        working-directory: backend

      - name: Generate OpenAPI spec
        run: |
          APP_VERSION=${{ steps.version.outputs.tag }} PYTHONPATH=$(pwd) uv run python export_openapi.py
        working-directory: backend

      - name: Commit version bump to PR branch
        env:
          # For a pull_request run this is the PR's branch; for a manual run
          # it is the branch the workflow was started on.
          TARGET_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/pyproject.toml frontend/package.json frontend/package-lock.json \
                  .vscode/tasks.json docs/references/api-docs/openapi.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.tag }}" || echo "Nothing to commit"

          # Another workflow can push to the same branch while this job runs
          # (the README sync does, whenever a release touches docs/index.md).
          # A plain push is then rejected as non-fast-forward, so rebase onto
          # whatever landed and try again.
          for attempt in 1 2 3; do
            if git push origin "HEAD:$TARGET_BRANCH"; then
              echo "Pushed the version bump on attempt $attempt."
              exit 0
            fi
            echo "Push $attempt was rejected. Rebasing onto origin/$TARGET_BRANCH..."
            git pull --rebase origin "$TARGET_BRANCH" || exit 1
            sleep 5
          done
          echo "::error::Could not push the version bump after 3 attempts."
          exit 1
